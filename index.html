<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador John - Sincronizado</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #1a252f; --success: #27ae60; --danger: #e74c3c; --accent: #2980b9; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        header { text-align: center; border-bottom: 2px solid var(--primary); margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 10px; color: white; text-align: center; margin-bottom: 10px; background: var(--primary); }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #eee; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .btn-delete { background: var(--danger); padding: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header><h2>Control de Gastos Sync</h2><p>JOHN GARCIA</p></header>

    <div class="card">
        <span>Total Gastos del Mes:</span>
        <h2 id="totalMes">$0</h2>
    </div>

    <div style="background:#f9f9f9; padding:15px; border-radius:10px;">
        <input type="text" id="desc" placeholder="¿En qué gastaste?">
        <input type="number" id="monto" placeholder="Monto $">
        <input type="date" id="fecha">
        <button onclick="agregarGasto()">+ Registrar Gasto</button>
    </div>

    <table id="tablaGastos">
        <thead>
            <tr><th>Fecha</th><th>Descripción</th><th>Monto</th><th></th></tr>
        </thead>
        <tbody id="cuerpo"></tbody>
    </table>
</div>

<script>
    // TU CONFIGURACIÓN REAL
    const firebaseConfig = {
      apiKey: "AIzaSyDAm4D-W2Qcjp_uqE1yb_b84YzniVfbSJQ",
      authDomain: "calendario-de-gastos-8e445.firebaseapp.com",
      projectId: "calendario-de-gastos-8e445",
      storageBucket: "calendario-de-gastos-8e445.firebasestorage.app",
      messagingSenderId: "888158866506",
      appId: "1:888158866506:web:555c751df0b1ca60212ab3",
      measurementId: "G-N0EEWH6J31",
      databaseURL: "https://calendario-de-gastos-8e445-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('gastos_john');

    let listaGastos = [];

    // ESCUCHAR CAMBIOS (Sincronización en tiempo real)
    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        listaGastos = data ? Object.values(data) : [];
        renderizar();
    });

    function agregarGasto() {
        const desc = document.getElementById('desc').value;
        const monto = document.getElementById('monto').value;
        const fecha = document.getElementById('fecha').value;

        if(!desc || !monto || !fecha) return alert("Llena todos los campos");

        const nuevoGasto = {
            id: Date.now(),
            desc,
            monto: parseFloat(monto),
            fecha
        };

        // Guardar en la nube
        dbRef.child(nuevoGasto.id).set(nuevoGasto);
        
        document.getElementById('desc').value = "";
        document.getElementById('monto').value = "";
    }

    function eliminarGasto(id) {
        dbRef.child(id).remove();
    }

    function renderizar() {
        const cuerpo = document.getElementById('cuerpo');
        const totalHtml = document.getElementById('totalMes');
        cuerpo.innerHTML = "";
        let total = 0;

        listaGastos.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(g => {
            total += g.monto;
            cuerpo.innerHTML += `
                <tr>
                    <td>${g.fecha}</td>
                    <td>${g.desc}</td>
                    <td>$${g.monto.toLocaleString()}</td>
                    <td><button class="btn-delete" onclick="eliminarGasto(${g.id})">X</button></td>
                </tr>`;
        });
        totalHtml.innerText = "$" + total.toLocaleString();
    }
</script>
</body>
</html>
